# Traefik Global Configuration for GCP Staging (SEMS / sems-vm)
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard Configuration
api:
  dashboard: true
  insecure: false

# Entrypoints Configuration
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

# Providers Configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true

  file:
    filename: /etc/traefik/dynamic.staging.yml
    watch: true

# Let's Encrypt Configuration (Production endpoint for staging)
# TLS-ALPN-01 uses port 443 only, no conflict with HTTP-to-HTTPS redirect
certificatesResolvers:
  letsencrypt:
    acme:
      email: jamesyinbaare@gmail.com
      storage: /certificates/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      tlsChallenge: {}

# Logging Configuration
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
