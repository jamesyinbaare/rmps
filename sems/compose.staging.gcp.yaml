# SEMS staging on the shared exam-tools GCE VM.
# Joins Traefik + Cloud SQL proxy on network monitoring-tools-network-staging.
# Deploy exam-tools first so that network and proxy exist.
services:
  sems-backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: sems-backend-staging
    env_file:
      - .env.staging.gcp
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: >
      sh -c "
        if [ -f app/scripts/prestart.sh ]; then
          bash app/scripts/prestart.sh
        fi &&
        fastapi run app/main.py --port 80
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - monitoring-tools-network

  sems-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    container_name: sems-frontend-staging
    environment:
      - NODE_ENV=production
      # Server-side fetches inside the frontend container (no NEXT_PUBLIC_API_BASE_URL).
      - INTERNAL_API_BASE_URL=http://sems-backend:80
    restart: unless-stopped
    depends_on:
      sems-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --no-verbose --tries=1 http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring-tools-network

networks:
  monitoring-tools-network:
    external: true
    name: monitoring-tools-network-staging
