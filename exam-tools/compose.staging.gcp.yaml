services:
  traefik:
    image: traefik:v3.6
    container_name: monitoring-tools-traefik-staging
    command:
      - "--configfile=/etc/traefik/traefik.staging.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.staging.yml:/etc/traefik/traefik.staging.yml:ro
      - ./traefik/dynamic.staging.yml:/etc/traefik/dynamic.staging.yml:ro
      - traefik_certs:/certificates
      - traefik_logs:/var/log/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-monitoring-staging.rule=Host(`traefik-monitoring-staging.jamesyin.com`)"
      - "traefik.http.routers.dashboard-monitoring-staging.entrypoints=websecure"
      - "traefik.http.routers.dashboard-monitoring-staging.tls=true"
      - "traefik.http.routers.dashboard-monitoring-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard-monitoring-staging.service=api@internal"
    restart: unless-stopped
    networks:
      - monitoring-tools-network
    depends_on:
      - monitoring-tools-backend
      - monitoring-tools-frontend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  monitoring-tools-backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: monitoring-tools-backend-staging
    env_file:
      - .env.staging.gcp
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: >
      sh -c "
        if [ -f app/scripts/prestart.sh ]; then
          bash app/scripts/prestart.sh
        fi &&
        fastapi run app/main.py --port 80
      "
    restart: unless-stopped
    depends_on:
      tools_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - monitoring-tools-network

  monitoring-tools-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    container_name: monitoring-tools-frontend-staging
    environment:
      - NODE_ENV=production
      # Server-side fetches inside the frontend container (no NEXT_PUBLIC_API_BASE_URL).
      - INTERNAL_API_BASE_URL=http://monitoring-tools-backend:80
    restart: unless-stopped
    depends_on:
      monitoring-tools-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --no-verbose --tries=1 http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring-tools-network

  tools_postgres:
    image: postgres:18.6
    container_name: monitoring-tools-postgres-staging
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      # Host bind mount survives compose down / down -v / container rebuilds.
      - ${POSTGRES_DATA_DIR:-/var/lib/exam-tools/postgres}:/var/lib/postgresql/data/pgdata
    env_file:
      - .env.staging.gcp
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB:-exam_tools_db}
    networks:
      - monitoring-tools-network
    # No host port published — DB is only reachable on the Docker network.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  db-backup:
    build:
      context: gcp/staging/backup
      dockerfile: Dockerfile
    container_name: monitoring-tools-db-backup-staging
    env_file:
      - .env.staging.gcp
    environment:
      - PGHOST=tools_postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER?Variable not set}
      - PGPASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - PGDATABASE=${POSTGRES_DB:-exam_tools_db}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME?Variable not set}
      - DB_BACKUP_GCS_PREFIX=${DB_BACKUP_GCS_PREFIX:-exam-tools/db-backups}
      - DB_BACKUP_RETENTION_DAYS=${DB_BACKUP_RETENTION_DAYS:-14}
      - DB_BACKUP_SCHEDULE=${DB_BACKUP_SCHEDULE:-0 2 * * *}
      - DB_BACKUP_MARKER_FILE=/var/tmp/last-backup-ok
    # tini as PID 1 — supercronic crash-loops when it must reap zombies itself
    init: true
    restart: unless-stopped
    depends_on:
      tools_postgres:
        condition: service_healthy
    healthcheck:
      # Fail if no successful backup marker within the last 36 hours.
      test:
        [
          "CMD-SHELL",
          "test -f /var/tmp/last-backup-ok && find /var/tmp/last-backup-ok -mmin -2160 | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15m
    networks:
      - monitoring-tools-network

volumes:
  traefik_certs:
    driver: local
  traefik_logs:
    driver: local

networks:
  monitoring-tools-network:
    driver: bridge
    name: monitoring-tools-network-staging
