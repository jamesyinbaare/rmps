<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lunch coupons — {{ subject_label }}</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0.75cm;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #0f172a;
            margin: 0;
            padding: 0;
        }

        .page {
            page-break-after: always;
            height: 28.2cm;
            overflow: hidden;
        }

        .page:last-child {
            page-break-after: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(5, 5.58cm);
            width: 100%;
            height: 28.2cm;
        }

        .coupon {
            height: 5.58cm;
            border: 1px dashed #b8c0cc;
            background: #ffffff;
            overflow: hidden;
            text-align: center;
        }

        .coupon-header {
            padding: 0.14cm 0.32cm 0.12cm;
            text-align: center;
            overflow: hidden;
            background-color: {{ brand_color }};
        }

        .coupon-name {
            font-size: 10pt;
            font-weight: 700;
            line-height: 1.15;
            color: #ffffff;
            max-height: 2.2em;
            overflow: hidden;
        }

        .coupon-cohort {
            font-size: 6.5pt;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.05cm;
            line-height: 1.15;
            max-height: 1.3em;
            overflow: hidden;
        }

        .coupon-body {
            background: #ffffff;
            padding: 0.1cm 0.3cm 0.12cm;
            height: 4.15cm;
            overflow: hidden;
        }

        .coupon-body-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #ffffff;
        }

        .coupon-body-table td {
            padding: 0;
            vertical-align: middle;
            text-align: center;
            background: #ffffff;
        }

        .coupon-qr-cell img {
            width: 2.8cm;
            height: 2.8cm;
            display: inline-block;
        }

        .coupon-code {
            font-family: "Courier New", Courier, monospace;
            font-size: 7.5pt;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #334155;
            word-break: break-all;
            line-height: 1.15;
            padding-top: 0.06cm;
        }

        .coupon-slot-empty {
            height: 5.58cm;
        }
    </style>
</head>
<body>
    {% for page in pages %}
    <div class="page">
        <div class="grid">
            {% for coupon in page %}
            {% if coupon %}
            <div class="coupon">
                <div class="coupon-header">
                    <div class="coupon-name">{{ coupon.name }}</div>
                    {% if cohort_name %}
                    <div class="coupon-cohort">{{ cohort_name }}</div>
                    {% endif %}
                </div>
                <div class="coupon-body">
                    <table class="coupon-body-table">
                        <tr>
                            <td class="coupon-qr-cell">
                                <img src="data:image/png;base64,{{ coupon.qr_base64 }}" alt="QR code" />
                            </td>
                        </tr>
                        <tr>
                            <td class="coupon-code-cell">
                                <div class="coupon-code">{{ coupon.reference_code }}</div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            {% else %}
            <div class="coupon-slot-empty"></div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</body>
</html>
