<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lunch coupons — {{ subject_label }}</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0.75cm;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #0f172a;
            margin: 0;
            padding: 0;
        }

        .page {
            page-break-after: always;
            height: 28.2cm;
            overflow: hidden;
        }

        .page:last-child {
            page-break-after: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(5, 5.58cm);
            width: 100%;
            height: 28.2cm;
        }

        .coupon {
            height: 5.58cm;
            border: 1px dashed #b8c0cc;
            background: #ffffff;
            overflow: hidden;
        }

        .coupon-header {
            height: 1.3cm;
            max-height: 1.3cm;
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
        }

        .coupon-header-layout {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .coupon-header-layout td {
            padding: 0;
            vertical-align: middle;
            border: none;
            background: transparent;
        }

        .coupon-header-main {
            text-align: center;
            padding: 0.1cm 0.12cm 0.08cm 0.28cm;
        }

        .coupon-header-logo {
            width: 0.72cm;
            text-align: right;
            padding-right: 0.2cm;
        }

        .coupon-header-logo img {
            width: 0.5cm;
            height: auto;
            opacity: 0.35;
            display: block;
            margin-left: auto;
        }

        .coupon-name {
            font-size: 10pt;
            font-weight: 700;
            line-height: 1.12;
            color: #ffffff;
            max-height: 2.2em;
            overflow: hidden;
            padding-top: 0.06cm;
        }

        .coupon-cohort {
            font-size: 6.5pt;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.88);
            margin-top: 0.04cm;
            line-height: 1.1;
            max-height: 1.2em;
            overflow: hidden;
        }

        .coupon-body {
            height: 4.28cm;
            max-height: 4.28cm;
            background: #ffffff;
            overflow: hidden;
            text-align: center;
        }

        .coupon-qr-zone {
            height: 3.35cm;
            padding-top: 0.1cm;
            text-align: center;
        }

        .qr-frame {
            display: inline-block;
            padding: 0.07cm;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top-width: 2px;
        }

        .qr-frame img {
            width: 2.7cm;
            height: 2.7cm;
            display: block;
        }

        .coupon-ref-strip {
            height: 0.93cm;
            max-height: 0.93cm;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 0.07cm 0.24cm 0.05cm;
            text-align: center;
            overflow: hidden;
        }

        .ref-label {
            display: block;
            font-size: 5pt;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #64748b;
            line-height: 1;
            margin-bottom: 0.04cm;
        }

        .ref-code {
            display: block;
            font-family: "Courier New", Courier, monospace;
            font-size: 7.5pt;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #334155;
            line-height: 1.1;
            word-break: break-all;
            max-height: 1.2em;
            overflow: hidden;
        }

        .coupon-slot-empty {
            height: 5.58cm;
        }
    </style>
</head>
<body>
    {% for page in pages %}
    <div class="page">
        <div class="grid">
            {% for coupon in page %}
            {% if coupon %}
            <div class="coupon">
                <div class="coupon-header" style="background-color: {{ brand_color }};">
                    <table class="coupon-header-layout">
                        <tr>
                            <td class="coupon-header-main">
                                <div class="coupon-name">{{ coupon.name }}</div>
                                {% if cohort_name %}
                                <div class="coupon-cohort">{{ cohort_name }}</div>
                                {% endif %}
                            </td>
                            <td class="coupon-header-logo">
                                <img src="img/logo-crest-only.png" alt="" />
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="coupon-body">
                    <div class="coupon-qr-zone">
                        <div class="qr-frame" style="border-top-color: {{ brand_color }};">
                            <img src="data:image/png;base64,{{ coupon.qr_base64 }}" alt="QR code" />
                        </div>
                    </div>
                    <div class="coupon-ref-strip">
                        <span class="ref-label">Reference</span>
                        <span class="ref-code">{{ coupon.reference_code }}</span>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="coupon-slot-empty"></div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</body>
</html>
